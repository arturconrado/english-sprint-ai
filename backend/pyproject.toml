[project]
name = "english-sprint-api"
version = "0.1.0"
description = "Contract-first API for English Sprint AI"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16.5,<2",
    "asyncpg>=0.30.0,<1",
    "cryptography==49.0.0",
    "fastapi>=0.116.1,<1",
    "httpx>=0.28.1,<1",
    "opentelemetry-api>=1.36.0,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.36.0,<2",
    "opentelemetry-instrumentation-asyncpg>=0.57b0,<1",
    "opentelemetry-instrumentation-fastapi>=0.57b0,<1",
    "opentelemetry-instrumentation-httpx>=0.57b0,<1",
    "opentelemetry-instrumentation-redis>=0.57b0,<1",
    "opentelemetry-sdk>=1.36.0,<2",
    "psycopg[binary]>=3.2.9,<4",
    "pydantic-settings>=2.10.1,<3",
    "redis>=6.4.0,<7",
    "sqlalchemy>=2.0.43,<3",
    "uvicorn[standard]>=0.35.0,<1",
    "websockets>=15.0.1,<16"
]

[dependency-groups]
dev = [
    "datamodel-code-generator==0.66.3",
    "jsonschema>=4.25.1,<5",
    "mypy>=1.17.1,<2",
    "openapi-spec-validator>=0.7.2,<1",
    "pip-audit>=2.9.0,<3",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.1.0,<2",
    "ruff>=0.12.9,<1",
    "types-jsonschema>=4.25.1.20250822",
    "types-pyyaml>=6.0.12.20250822",
    "types-redis>=4.6.0.20241004"
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["src/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
exclude = ["src/generated"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "alembic.*",
    "asyncpg",
    "asyncpg.*",
    "opentelemetry.instrumentation.*"
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["generated.*"]
ignore_errors = true
