name: Phase 1 Validation

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: phase1-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  contract:
    name: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.7"
          enable-cache: true

      - name: Install locked tooling
        run: |
          npm ci
          uv sync --project backend --group dev --locked

      - name: Validate contract and generated sources
        run: ./scripts/verify-contracts

  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: english_sprint
          POSTGRES_USER: english_sprint
          POSTGRES_PASSWORD: english_sprint
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U english_sprint -d english_sprint"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8.0.3-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://english_sprint:english_sprint@localhost:5432/english_sprint
      REDIS_URL: redis://localhost:6379/0
      OTEL_ENABLED: "false"
      REALTIME_ENABLED: "false"
      BACKEND_INTEGRATION: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.7"
          enable-cache: true

      - name: Install locked backend
        run: uv sync --project backend --group dev --locked

      - name: Lint and type-check
        working-directory: backend
        run: |
          uv run ruff format --check src tests migrations
          uv run ruff check src tests migrations
          uv run mypy src tests

      - name: Apply migrations
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Run backend tests
        working-directory: backend
        run: uv run pytest

      - name: Run offline pedagogical evaluation harness
        run: ./scripts/pedagogy-eval offline

      - name: Exercise migrations and live readiness
        run: ./scripts/ci-backend-smoke

  android:
    name: android
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Test shared code and build Android debug
        run: |
          ./gradlew --no-daemon --max-workers=2 \
            :shared:testAndroidHostTest \
            :apps:androidApp:testDebugUnitTest \
            :apps:androidApp:lintDebug \
            :apps:androidApp:assembleDebug

      - name: Enable and validate KVM acceleration
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          stat --format='%A %U %G %n' /dev/kvm

      - name: Run Android instrumented lifecycle tests
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew --no-daemon --max-workers=2 :apps:androidApp:connectedDebugAndroidTest

  ios:
    name: ios
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate fixed Apple toolchain
        run: |
          uname -m
          test -d "${DEVELOPER_DIR}"
          xcodebuild -version
          swift --version

      - name: Set up Java 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5

      - name: Build KMP simulator framework
        run: ./gradlew --no-daemon --max-workers=2 :shared:linkDebugFrameworkIosSimulatorArm64

      - name: Build unsigned SwiftUI shell
        run: |
          xcodebuild \
            -project apps/iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.7"
          enable-cache: true

      - name: Audit locked dependencies
        run: |
          npm ci
          npm audit
          uv sync --project backend --group dev --locked
          uv run --project backend pip-audit

      - name: Reject forbidden files
        run: |
          if find . -path ./.git -prune -o \
            \( -name '.env' -o -name '*.jks' -o -name '*.keystore' -o \
            -name '*.p12' -o -name '*.mobileprovision' \) -print | grep -q .; then
            echo "Forbidden secret-bearing file detected."
            exit 1
          fi

      - name: Verify pinned supply chain
        run: ./scripts/verify-supply-chain

      - name: Scan repository for secrets
        run: |
          archive="/tmp/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            --output "${archive}"
          printf '%s  %s\n' \
            "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" \
            "${archive}" | sha256sum --check --status
          tar -xzf "${archive}" -C /tmp gitleaks
          /tmp/gitleaks git . --redact --no-banner
